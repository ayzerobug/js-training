<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - JS Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF3256;
            --primary-dark: #CC2845;
            --text-dark: #0A0E27;
            --text-light: #64748B;
            --bg: #F8FAFC;
            --white: #FFFFFF;
            --border: #E8F0FF;
            --cart-width: 360px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text-dark);
            min-height: 100vh;
        }

        /* ── NAVBAR ── */
        .navbar {
            background: var(--white);
            border-bottom: 2px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -1px;
        }

        .navbar .logo span {
            color: var(--primary);
        }

        .cart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.2s;
            position: relative;
        }

        .cart-btn:hover {
            background: var(--primary-dark);
        }

        .cart-count {
            background: white;
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 800;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── HERO ── */
        .hero {
            background: linear-gradient(135deg, var(--text-dark) 0%, #1a1f3a 100%);
            color: white;
            padding: 4rem 2rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 0.8rem;
        }

        .hero h1 span {
            color: var(--primary);
        }

        .hero p {
            font-size: 1.1rem;
            opacity: 0.7;
        }

        /* ── MAIN LAYOUT ── */
        .main {
            display: grid;
            grid-template-columns: 1fr var(--cart-width);
            gap: 0;
            min-height: calc(100vh - 140px);
        }

        /* ── PRODUCTS ── */
        .products-section {
            padding: 2.5rem 2rem;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--text-dark);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .product-card {
            background: var(--white);
            border: 2px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            border-color: var(--primary);
            box-shadow: 0 12px 30px rgba(255, 50, 86, 0.12);
            transform: translateY(-4px);
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: linear-gradient(135deg, #f0f4f8, #e8f0ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .product-info {
            padding: 1.2rem;
        }

        .product-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.3rem;
        }

        .product-category {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary);
        }

        .add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .add-btn:hover {
            background: var(--primary-dark);
        }

        .add-btn:active {
            transform: scale(0.96);
        }

        /* ── CART SIDEBAR ── */
        .cart-sidebar {
            background: var(--white);
            border-left: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 70px);
            position: sticky;
            top: 70px;
        }

        .cart-header {
            padding: 1.5rem;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cart-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .cart-items-count {
            background: rgba(255, 50, 86, 0.1);
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .cart-empty {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-light);
        }

        .cart-empty i {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
            opacity: 0.3;
        }

        .cart-empty p {
            font-size: 0.9rem;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem;
            border-radius: 10px;
            background: var(--bg);
            margin-bottom: 0.8rem;
        }

        .cart-item-emoji {
            font-size: 1.8rem;
            flex-shrink: 0;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .cart-item-price {
            font-size: 0.82rem;
            color: var(--primary);
            font-weight: 700;
        }

        .cart-item-remove {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
            display: flex;
            align-items: center;
        }

        .cart-item-remove:hover {
            color: var(--primary);
            background: rgba(255, 50, 86, 0.08);
        }

        .cart-footer {
            padding: 1.5rem;
            border-top: 2px solid var(--border);
        }

        .cart-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }

        .cart-total-label {
            font-size: 0.9rem;
            color: var(--text-light);
            font-weight: 500;
        }

        .cart-total-amount {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        .checkout-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .checkout-btn:hover {
            background: var(--primary-dark);
        }

        .checkout-btn:disabled {
            background: #CBD5E1;
            cursor: not-allowed;
        }

        .clear-btn {
            width: 100%;
            background: none;
            color: var(--text-light);
            border: 2px solid var(--border);
            padding: 0.6rem;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.7rem;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-dark);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-size: 0.88rem;
            font-weight: 600;
            transition: transform 0.3s ease;
            z-index: 999;
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 900px) {
            .main {
                grid-template-columns: 1fr;
            }

            .cart-sidebar {
                position: fixed;
                right: 0;
                top: 0;
                height: 100vh;
                width: var(--cart-width);
                transform: translateX(100%);
                transition: transform 0.3s ease;
                z-index: 200;
            }

            .cart-sidebar.open {
                transform: translateX(0);
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 560px) {
            .products-grid {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">Shop<span>Easy</span></div>
        <button class="cart-btn" id="cart-toggle-btn">
            <i class="hgi-stroke hgi-shopping-cart-01"></i>
            Cart
            <span class="cart-count" id="cart-count">0</span>
        </button>
    </nav>

    <!-- HERO -->
    <div class="hero">
        <h1>Fresh <span>Arrivals</span></h1>
        <p>Pick your favourites and add them to your cart</p>
    </div>

    <!-- MAIN -->
    <div class="main">
        <!-- PRODUCTS -->
        <div class="products-section">
            <p class="section-title">All Products</p>
            <div class="products-grid" id="products-grid">

            </div>
        </div>

        <!-- CART SIDEBAR -->
        <aside class="cart-sidebar" id="cart-sidebar">
            <div class="cart-header">
                <h2>Your Cart</h2>
                <span class="cart-items-count" id="cart-items-count">0 items</span>
            </div>

            <div class="cart-items" id="cart-items">
                <div class="cart-empty" id="cart-empty">
                    <i class="hgi-stroke hgi-shopping-cart-01"></i>
                    <p>Your cart is empty.<br>Add some products!</p>
                </div>
            </div>

            <div class="cart-footer">
                <div class="cart-total-row">
                    <span class="cart-total-label">Total</span>
                    <span class="cart-total-amount">&#x20A6;<span id="cart-total">0</span></span>
                </div>
                <button class="checkout-btn" id="checkout-btn" disabled>Checkout</button>
                <button class="clear-btn" id="clear-btn">Clear Cart</button>
            </div>
        </aside>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- <script src="script.js"></script> -->
    <script type="module" src="scripts/main.js"></script>
</body>

</html>
