<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body class="bg-slate-100 h-screen flex justify-center items-center">
    <div class="w-full max-w-md mx-auto p-8 bg-white max-h-[70vh] overflow-auto space-y-4 rounded-2xl shadow">
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">
                Full name
            </label>
            <input type="text" placeholder="Ada Obi" class="w-full px-4 py-3
            border border-slate-300 rounded-lg
            placeholder:text-slate-400
            focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500
            transition">
            <p class="text-sm text-red-500 mt-1">Please enter a valid full name</p>
        </div>
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">
                BIO
            </label>
            <textarea rows="4" type="text" placeholder="Ada Obi" class="w-full px-4 py-3
         border border-slate-300 rounded-lg
         placeholder:text-slate-400
         focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500
         transition"></textarea>
        </div>
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">
                Select Gender
            </label>
            <select
                class="w-full border border-slate-300 px-4 py-3 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-green-500">
                <option value="">Choose a box size</option>
                <option value="small">Small — ₦15,000</option>
                <option value="family">Small — ₦28,000</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">
                Email Address
            </label>
            <input type="email" placeholder="yourname@example.com" class="w-full px-4 py-3
         border border-slate-300 rounded-lg
         placeholder:text-slate-400
         focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500
         transition">
        </div>
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">
                Password
            </label>
            <input type="password" placeholder="*******" class="w-full px-4 py-3
         border border-slate-300 rounded-lg
         placeholder:text-slate-400
         focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500
         transition">
        </div>
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">
                Password Confirmation
            </label>
            <input type="password" placeholder="*******" class="w-full px-4 py-3
         border border-slate-300 rounded-lg
         placeholder:text-slate-400
         focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500
         transition">
        </div>

        <div class="pt-6">
            <button
                class="bg-[#FF3256] hover:bg-[#FF3256]/90  w-full py-2 rounded-md text-white transition">Proceed</button>
        </div>
    </div>
</body>

</html>
