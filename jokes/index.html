<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joke Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0A0E27 0%, #1a1f3a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .emoji {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            display: block;
        }

        .label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #FF3256;
            margin-bottom: 1.5rem;
        }

        #setup {
            font-size: 1.4rem;
            font-weight: 700;
            color: white;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            min-height: 2.5rem;
        }

        .divider {
            width: 40px;
            height: 3px;
            background: linear-gradient(90deg, #FF3256, #00D9FF);
            border-radius: 10px;
            margin: 0 auto 1.5rem;
        }

        #punchline {
            font-size: 1.1rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.7;
            min-height: 2rem;
        }

        #status {
            font-size: 0.88rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 1.5rem;
            min-height: 1.5rem;
        }

        #error {
            font-size: 0.88rem;
            color: #ff0000;
            margin-top: 1.5rem;
            min-height: 1.5rem;
        }


        .btn-wrap {
            margin-top: 2.5rem;
        }

        button {
            background: linear-gradient(135deg, #FF3256, #FF6B7A);
            color: white;
            border: none;
            padding: 0.9rem 2.5rem;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(255, 50, 86, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* PRELOADER */
        .preloader {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0A0E27 0%, #1a1f3a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .preloader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .spinner {
            width: 56px;
            height: 56px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #FF3256;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1.2rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .preloader p {
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <!-- PRELOADER -->
    <div class="preloader" id="preloader">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <div class="card">
        <span class="emoji">&#x1F602;</span>
        <p class="label">Random Joke</p>

        <p id="setup"></p>
        <div class="divider"></div>
        <p id="punchline"></p>

        <p id="error" class="hidden"></p>

        <div class="btn-wrap">
            <button id="joke-btn">Generate Joke</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
